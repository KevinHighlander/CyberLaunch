name: CLIM CI

on:
  push:
    paths:
      - "geopolitical-intelligence-monitor/**"
      - ".github/workflows/clim-ci.yml"

  pull_request:
    paths:
      - "geopolitical-intelligence-monitor/**"
      - ".github/workflows/clim-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: geopolitical-intelligence-monitor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14.6"
          cache: "pip"
          cache-dependency-path: geopolitical-intelligence-monitor/requirements.txt

        - name: Install CLIM and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check app tests

      - name: Pytest
        run: python -m pytest